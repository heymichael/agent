[tool.pytest.ini_options]
markers = [
    # ── Legacy / top-level ────────────────────────────────────────────────
    "expense_analytics: tests for the expense analytics domain (spend tools, period parsing)",
    "vendor_management: tests for the vendor management domain (CRUD tools, CSV, write auth, delegation)",
    "llm_live: live LLM tests that call the real OpenAI API (slow, costs money, needs OPENAI_API_KEY)",
    # ── Agent ─────────────────────────────────────────────────────────────
    "agent_vendor_management: tests handled by the vendor-management agent",
    "agent_expense_analytics: tests handled by the expense-analytics agent",
    # ── Domain ────────────────────────────────────────────────────────────
    "domain_vendors: vendor app domain",
    "domain_spend: spend/expense analytics domain",
    "domain_expense_analytics: expense analytics domain",
    # ── Module ────────────────────────────────────────────────────────────
    "module_data_management: data management module (CRUD, CSV, vendor resolution)",
    "module_analytics: analytics module (spend queries, period parsing)",
    "module_acl: access control module (write auth, department scoping)",
    "module_list: vendor listing module (filters, count)",
    "module_csv_download: CSV download behavior for list results",
    "module_multi_turn: multi-turn conversation context",
    "module_multi_vendor: multi-vendor sequential and bulk operations",
    "module_single_edit: single-vendor edit operations",
    "module_spend_queries: spend query routing and delegation",
    # ── Capability ────────────────────────────────────────────────────────
    "capability_csv_bulk_edit: CSV upload and batch edit flow",
    "capability_vendor_lookup: single-vendor profile lookup",
    "capability_csv_download: CSV file download for list results",
    "capability_csv_generation: explicit CSV generation for named vendors",
    "capability_csv_threshold: vendor count threshold triggering CSV redirect",
    "capability_column_visibility: table column visibility control",
    "capability_table_filters: table row filtering control",
    "module_table_controls: table view control module (column visibility, row filters)",
    "capability_disambiguation: vendor disambiguation selection flow",
    "capability_mode_switch: switching between CSV and single-vendor flows",
    "capability_multi_turn_context: multi-turn tool history replay",
    "capability_sequential_modify: sequential multi-vendor field edits",
    "capability_single_vendor_modify: single vendor field modification",
    "capability_spend_detail: spend detail drill-down queries",
    "capability_spend_tool_selection: correct spend tool routing",
    "capability_vendor_list: vendor listing queries",
    "capability_vendor_list_filtering: vendor list filter usage",
    "capability_vendor_resolution: fuzzy name matching and disambiguation",
    "capability_write_access_control: department-based write ACL",
    # ── Tool ──────────────────────────────────────────────────────────────
    "tool_vendor_lookup: tests exercising the vendor_lookup tool",
    "tool_vendor_count: tests exercising the vendor_count tool",
    "tool_vendor_list: tests exercising the vendor_list tool",
    "tool_add_vendor: tests exercising the add_vendor tool",
    "tool_modify_vendor: tests exercising the modify_vendor tool",
    "tool_generate_vendor_edit_csv: tests exercising the generate_vendor_edit_csv tool",
    "tool_process_vendor_csv: tests exercising the process_vendor_csv tool",
    "tool_ask_expense_agent: tests exercising expense agent delegation",
    "tool_set_view_columns: tests exercising the set_view_columns tool",
    "tool_set_table_filters: tests exercising the set_table_filters tool",
]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
]
