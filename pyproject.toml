[tool.pytest.ini_options]
markers = [
    "expense_analytics: tests for the expense analytics domain (spend tools, period parsing)",
    "vendor_management: tests for the vendor management domain (CRUD tools, CSV, write auth, delegation)",
    "llm_live: live LLM tests that call the real OpenAI API (slow, costs money, needs OPENAI_API_KEY)",
    "agent_vendor_management: tests handled by the vendor-management agent",
    "agent_expense_analytics: tests handled by the expense-analytics agent",
    "domain_vendors: vendor app domain",
    "domain_expense_analytics: expense analytics domain",
    "module_data_management: data management module (CRUD, CSV, vendor resolution)",
    "module_analytics: analytics module (spend queries, period parsing)",
    "module_acl: access control module (write auth, department scoping)",
    "module_list: vendor listing module (filters, CSV download, count)",
    "module_multi_turn: multi-turn conversation context",
    "capability_csv_bulk_edit: CSV upload and batch edit flow",
    "capability_column_visibility: table column visibility control",
    "capability_vendor_modify: single vendor field modification",
    "capability_vendor_resolution: fuzzy name matching and disambiguation",
    "capability_csv_download: CSV file download for list results",
    "capability_vendor_list_filtering: vendor list filter usage",
    "capability_spend_detail: spend detail drill-down queries",
    "capability_spend_summary: spend summary queries",
    "capability_multi_turn_context: multi-turn tool history replay",
    "capability_multi_vendor_sequential: sequential multi-vendor edits",
    "capability_write_access_control: department-based write ACL",
    "capability_mode_switch: switching between CSV and single-vendor flows",
]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
]
