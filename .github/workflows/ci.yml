name: app-ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: PR checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile service/app.py service/pg_client.py service/auth.py service/tools.py

      - name: Run tests
        run: python -m pytest tests/ -x -q --ignore=tests/test_csv_e2e.py --ignore=tests/test_write_auth_e2e.py --ignore=tests/test_tabular_e2e.py
