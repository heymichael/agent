name: update-schema-docs

# Regenerate SchemaSpy database documentation when migrations change.
on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INSTANCE_CONNECTION_NAME: "haderach-ai:us-central1:haderach-main"
  DB_NAME: "haderach"
  DB_SCHEMA: "public"

jobs:
  regenerate:
    name: Regenerate SchemaSpy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch DATABASE_URL from Secret Manager
        id: secrets
        run: |
          DATABASE_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL)
          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> "$GITHUB_OUTPUT"

      - name: Parse database credentials
        id: creds
        env:
          DATABASE_URL: ${{ steps.secrets.outputs.database_url }}
        run: |
          # Extract user:password from postgresql://user:password@/dbname?host=...
          USERPASS=$(echo "$DATABASE_URL" | sed -n 's|postgresql://\([^@]*\)@.*|\1|p')
          DB_USER=$(echo "$USERPASS" | cut -d: -f1)
          DB_PASS=$(echo "$USERPASS" | cut -d: -f2-)
          echo "::add-mask::$DB_PASS"
          echo "db_user=$DB_USER" >> "$GITHUB_OUTPUT"
          echo "db_pass=$DB_PASS" >> "$GITHUB_OUTPUT"

      - name: Download Cloud SQL Auth Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy "$INSTANCE_CONNECTION_NAME" --port 5432 &
          sleep 5

      - name: Create output directory
        run: mkdir -p schemaspy-output

      - name: Run SchemaSpy
        env:
          PGUSER: ${{ steps.creds.outputs.db_user }}
          PGPASSWORD: ${{ steps.creds.outputs.db_pass }}
        run: |
          docker run --rm --network host \
            -v "$(pwd)/schemaspy-output:/output" \
            schemaspy/schemaspy:latest \
            -t pgsql11 \
            -host 127.0.0.1 \
            -port 5432 \
            -db "$DB_NAME" \
            -s "$DB_SCHEMA" \
            -u "$PGUSER" \
            -p "$PGPASSWORD" \
            -desc "Transformation Platform" \
            -o /output

      - name: Clone haderach-content
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/heymichael/haderach-content.git" content-repo

      - name: Copy generated docs
        run: |
          rm -rf content-repo/public/db-schema/*
          cp -r schemaspy-output/* content-repo/public/db-schema/

      - name: Check for changes and commit
        id: commit
        working-directory: content-repo
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "chore: regenerate SchemaSpy docs

Triggered by migration change in heymichael/agent@${{ github.sha }}"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger content deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          gh workflow run deploy-content.yml \
            --repo heymichael/haderach-platform \
            --field target_env=production
          echo "Triggered deploy-content workflow"
