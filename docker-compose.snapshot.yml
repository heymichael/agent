services:
  snapshot-postgres:
    image: postgres:15
    container_name: haderach-snapshot-pg
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: haderach_snapshot
      POSTGRES_USER: snapshot
      POSTGRES_PASSWORD: localdev
    volumes:
      - snapshot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapshot -d haderach_snapshot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  snapshot-pgdata:
