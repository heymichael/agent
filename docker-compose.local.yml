services:
  local-postgres:
    image: postgres:15
    container_name: haderach-local-pg
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: haderach_local
      POSTGRES_USER: agent_local
      POSTGRES_PASSWORD: localdev
    volumes:
      - local-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_local -d haderach_local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  local-pgdata:
